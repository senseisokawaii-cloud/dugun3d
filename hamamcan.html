<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamamcan Avatar</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent!important;font-family:system-ui,Segoe UI,Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.55);color:#fff;z-index:5}
#start button{font-size:22px;padding:14px 26px;border-radius:14px;border:0;background:#e8909a;color:#2a0d10;font-weight:800;cursor:pointer}
#start small{opacity:.8;font-size:13px;text-align:center;max-width:340px}
#panel{position:fixed;top:10px;left:10px;width:300px;max-height:calc(100vh - 20px);overflow:auto;background:rgba(20,14,18,.92);color:#fff;border-radius:12px;padding:12px;font-size:13px;z-index:6;display:none}
#panel h3{margin:0 0 8px;font-size:15px}
#panel label{display:block;margin:7px 0 2px;opacity:.85}
#panel input[type=range],#panel select,#panel input[type=text]{width:100%;box-sizing:border-box}
#panel .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#panel button{background:#3a2a33;color:#fff;border:1px solid #6a4a58;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12px}
#meter{height:8px;background:#333;border-radius:4px;overflow:hidden;margin-top:4px}
#meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5c5,#ec5,#e55)}
#ws{font-size:11px;opacity:.75;margin-top:6px}
#hint{position:fixed;right:8px;bottom:6px;color:#fff;font-size:11px;opacity:.0;transition:opacity .4s;z-index:4;text-shadow:0 1px 2px #000}
body:hover #hint{opacity:.55}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start"><button id="go">🎤 Mikrofonu başlat</button><small>Konuştukça ağzı oynar. Mikrofon olmadan denemek için <b>Boşluk</b> tuşunu basılı tut. Ayarlar: <b>H</b></small></div>
<div id="panel">
  <h3>Hamamcan ayarları <span class="ver" style="opacity:.6;font-weight:400"></span></h3>
  <label>Mikrofon</label><select id="micSel"></select>
  <div id="meter"><i></i></div>
  <label>Hassasiyet <span id="gainV"></span></label><input id="gain" type="range" min="0.5" max="4" step="0.1">
  <label>Gürültü kapısı (dB) <span id="gateV"></span></label><input id="gate" type="range" min="2" max="25" step="1">
  <label>Arka plan</label>
  <select id="bgSel"><option value="seffaf">Şeffaf (PNG gibi)</option><option value="yesil">Yeşil perde</option></select>
  <label>Karakter boyutu <span id="zoomV"></span></label><input id="zoom" type="range" min="0.6" max="1.6" step="0.02">
  <label>Uyuma süresi (sn, sessizlikte) <span id="sleepV"></span></label><input id="sleep" type="range" min="15" max="300" step="5">
  <label>Kafa hareketi <span id="motionV"></span></label><input id="motion" type="range" min="0" max="2" step="0.1">
  <label>TikFinity WebSocket</label><input id="wsUrl" type="text">
  <div id="ws">bağlanıyor…</div>
  <div class="row">
    <button data-t="gift">🎁 Hediye</button><button data-t="big">💎 Büyük hediye</button><button data-t="like">❤ Beğeni</button>
    <button data-t="chat">💬 Yorum</button><button data-t="follow">➕ Takip</button><button data-t="think">🤔 Düşün</button><button data-t="shout">😱 Bağır</button><button data-t="sleep">😴 Uyu</button>
  </div>
</div>
<div id="hint">H: ayarlar · Boşluk: test konuşma</div>
<script>
'use strict';
const VERSION='v3.1';document.querySelectorAll('.ver').forEach(e=>e.textContent=VERSION);

const ease=(cur,tgt,rate,dt)=>cur+(tgt-cur)*(1-Math.exp(-rate*dt));
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
// ---------- settings ----------
const DEF={gain:2,gate:6,bg:'seffaf',zoom:.95,sleep:60,name:'',frame:false,thanks:false,motion:1,ws:'ws://127.0.0.1:21213/',mic:''};
let S={...DEF};try{Object.assign(S,JSON.parse(localStorage.getItem('hamamcan3')||'{}'))}catch(e){}

if(S.bg!=='seffaf'&&S.bg!=='yesil')S.bg='seffaf';S.name='';S.frame=false;S.thanks=false;
const save=()=>{try{localStorage.setItem('hamamcan3',JSON.stringify(S))}catch(e){}};

function rnd2(R,a,b){return a+R()*(b-a)}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

  if(S.bg!=='resim'){bc.filter=`blur(${Math.round(h*.006)}px)`;bc.drawImage(t,0,0);bc.filter='none'}else bc.drawImage(t,0,0);
  const v=bc.createRadialGradient(w/2,h*.45,h*.3,w/2,h*.5,h*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.35)');bc.fillStyle=v;bc.fillRect(0,0,w,h)}

// ---------- state ----------
const P={tilt:0,hx:0,hy:0,breath:0,mouth:0,blink:0,jump:0,sleep:0,squash:0,ant:0,antV:0};
let tNow=0,talkLvl=0,lvlSlow=0,lastVoice=0,lastEvent=0,blinkT=1.5,blinkPh=-1,doubleBlink=false,thinkUntil=0,thinkNext=14,thinkDir=1,react=null,bubble=null,nodV=0,nodY=0,bobV=0,bob=0,jumpV=0,jumpY=0;
const parts=[];
// ---------- audio ----------
let ac=null,an=null,buf=null,stream=null,floor=-60;
async function startMic(devId){
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:devId?{exact:devId}:undefined,echoCancellation:false,noiseSuppression:true,autoGainControl:false}});
    if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    try{await ac.resume()}catch(e){}
    const src=ac.createMediaStreamSource(stream);an=ac.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.2;src.connect(an);
    buf=new Float32Array(an.fftSize);
    listMics();checkRunning();
  }catch(e){if(devId){S.mic='';save();return startMic('')}document.querySelector('#start small').innerHTML='Mikrofon açılamadı: '+e.name+'<br>Sayfa https üzerinden açılmalı ve mikrofon izni verilmeli. Boşluk tuşuyla test edebilirsin.'}
}
function checkRunning(){const st=document.getElementById('start');if(ac&&ac.state==='running'){st.style.display='none'}else{st.style.display='flex';document.getElementById('go').textContent='🔊 Tıkla, sesi başlat';}}
const unlock=()=>{if(ac&&ac.state!=='running')ac.resume().then(checkRunning).catch(()=>{})};addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);
setInterval(()=>{if(ac&&ac.state!=='running')checkRunning()},2000);
async function listMics(){try{const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');const sel=document.getElementById('micSel');sel.innerHTML='';for(const d of ds){const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'Mikrofon';if(d.deviceId===S.mic)o.selected=true;sel.appendChild(o)}}catch(e){}}
document.getElementById('go').onclick=()=>{if(an&&ac){ac.resume().then(checkRunning)}else startMic(S.mic)};
if(location.protocol==='file:')document.querySelector('#start small').innerHTML+='<br><b>Not:</b> Dosyayı çift tıklayarak açtın. Mikrofon için GitHub linkinden aç.';
document.getElementById('start').onclick=e=>{if(e.target.id==='start')document.getElementById('start').style.display='none'};
(async()=>{try{const p=await navigator.permissions.query({name:'microphone'});if(p.state==='granted')startMic(S.mic)}catch(e){}})();
let fakeTalk=false;
function readAudio(dt){
  let lvl=0;
  if(an){an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];const db=20*Math.log10(Math.sqrt(s/buf.length)+1e-9);
    if(db<floor)floor=ease(floor,db,8,dt);else floor+=(db-floor)*Math.min(1,dt*.04);floor=clamp(floor,-90,-35);
    lvl=clamp((db-floor-S.gate)/28*S.gain);
    const m=document.querySelector('#meter i');if(m)m.style.width=(lvl*100).toFixed(0)+'%'}
  if(fakeTalk){const syl=Math.max(0,Math.sin(tNow*10.5)+Math.sin(tNow*6.3+1)*.6);lvl=Math.max(lvl,clamp(syl*.75)*(.55+.45*Math.sin(tNow*1.7)))}
  return lvl;
}
// ---------- events ----------
function antKick(k){P.antV+=k*(Math.random()<.5?-1:1)}
function addHearts(n,kind){for(let i=0;i<n;i++)parts.push({k:kind,x:Math.random()<.5?rnd(120,330):rnd(930,1140),y:rnd(250,620),vx:rnd(-120,120),vy:rnd(-380,-180),life:rnd(1.4,2.4),t:0,r:rnd(22,38)})}
function startReact(kind,nick){lastEvent=tNow;if(P.sleep>.3)wake();
  if(kind==='gift'||kind==='big'){const big=kind==='big';react={kind,t0:tNow,dur:big?3.2:1.8};jumpV-=big?520:380;antKick(big?14:9);
    if(S.thanks&&nick)bubble={text:(big?'Vay be! Sağ ol ':'Sağ ol ')+nick+(big?' 💎':' 🎁'),until:tNow+(big?4:3)};}
  else if(kind==='like'){antKick(3);if(Math.random()<.35)0}
  else if(kind==='chat'){nodV+=140}
  else if(kind==='follow'){nodV+=260;react={kind:'follow',t0:tNow,dur:1.2};}
  else if(kind==='think'){thinkUntil=tNow+5;thinkDir=Math.random()<.5?-1:1}
  else if(kind==='shout'){react={kind:'shout',t0:tNow,dur:1.2};jumpV-=300;antKick(10)}
  else if(kind==='sleep'){lastVoice=tNow-S.sleep-1;lastEvent=lastVoice}
}
function wake(){antKick(12);jumpV-=320;react={kind:'startle',t0:tNow,dur:.7}}
// ---------- TikFinity ----------
let ws=null,wsTimer=null;
function connectWS(){try{if(ws){ws.onclose=null;ws.close()}}catch(e){}
  const el=document.getElementById('ws');
  try{ws=new WebSocket(S.ws)}catch(e){el.textContent='WS adresi hatalı';return}
  ws.onopen=()=>el.textContent='TikFinity bağlı ✅';
  ws.onclose=()=>{el.textContent='TikFinity bağlı değil (yeniden deneniyor)';clearTimeout(wsTimer);wsTimer=setTimeout(connectWS,4000)};
  ws.onerror=()=>{};
  ws.onmessage=m=>{let j;try{j=JSON.parse(m.data)}catch(e){return}const ev=j.event,d=j.data||{};const nick=d.nickname||d.uniqueId||'';
    if(ev==='gift'){if(d.giftType===1&&!d.repeatEnd)return;const coins=(d.diamondCount||1)*(d.repeatCount||1);startReact(coins>=99?'big':'gift',nick)}
    else if(ev==='like')startReact('like');else if(ev==='chat')startReact('chat');else if(ev==='follow')startReact('follow',nick)};
}
// ---------- update ----------
function noise(t,s){return Math.sin(t*.37+s)*.5+Math.sin(t*.71+s*2.1)*.3+Math.sin(t*1.33+s*3.7)*.2}
function update(dt){
  const lvl=readAudio(dt);
  talkLvl=ease(talkLvl,lvl,lvl>talkLvl?30:14,dt);lvlSlow=ease(lvlSlow,lvl,3,dt);
  const talking=talkLvl>.07;if(talking){if(P.sleep>.5)wake();lastVoice=tNow}
  if(lvl-lvlSlow>.28&&bobV>-40){bobV-=120+lvl*140;if(Math.random()<.3)antKick(3)}
  const silent=tNow-Math.max(lastVoice,lastEvent);
  const sleepT=silent>S.sleep?1:0;
  let mouthT=clamp(talkLvl*1.2),forceBlink=0;
  if(react){const k=(tNow-react.t0)/react.dur;if(k>1)react=null;else{
    if(react.kind==='gift'||react.kind==='big'){mouthT=Math.max(mouthT,k<.35?1:.55);if(react.kind==='big'&&k<.8&&jumpY>-5&&jumpV>-50)jumpV-=260}
    else if(react.kind==='shout'||react.kind==='startle')mouthT=1;
    else if(react.kind==='follow'){mouthT=Math.max(mouthT,.5);forceBlink=k>.2&&k<.7?1:0}}}
  // think idle
  if(!talking&&silent>8&&!sleepT&&tNow>thinkNext&&tNow>thinkUntil){if(Math.random()<.6){thinkUntil=tNow+rnd(3,6);thinkDir=Math.random()<.5?-1:1}thinkNext=tNow+rnd(12,24)}
  const thinking=tNow<thinkUntil&&!talking?1:0;
  // blink
  blinkT-=dt;if(blinkT<=0&&blinkPh<0){blinkPh=0;doubleBlink=Math.random()<.2}
  let bl=0;if(blinkPh>=0){blinkPh+=dt;const d=.06,u=.1;bl=blinkPh<d?blinkPh/d:blinkPh<d+u?1-(blinkPh-d)/u:0;if(blinkPh>d+u){if(doubleBlink){doubleBlink=false;blinkPh=0}else{blinkPh=-1;blinkT=talking?rnd(1.6,4):rnd(2.2,6)}}}
  P.sleep=ease(P.sleep,sleepT,1.5,dt);
  P.blink=Math.max(bl,forceBlink,sstep(.4,.8,P.sleep));
  P.mouth=ease(P.mouth,P.sleep>.5&&!react?0:mouthT,mouthT>P.mouth?32:20,dt);
  if(false)parts.push({k:'z',x:860,y:260,vx:rnd(30,70),vy:-80,life:2.6,t:0,r:rnd(40,60)});
  // motion
  const mo=S.motion;
  bobV+=(-bob*110-bobV*10)*dt;bob+=bobV*dt;nodV+=(-nodY*80-nodV*9)*dt;nodY+=nodV*dt;
  jumpV+=2400*dt;jumpY+=jumpV*dt;if(jumpY>0){jumpY=0;if(jumpV>200)P.squash=.07;jumpV=0}
  P.squash=ease(P.squash,0,8,dt);
  const en=talking?1:.55,sl=P.sleep;
  const tiltT=(noise(tNow*(talking?1.5:.9),1)*.05*en+(talking?Math.sin(tNow*5.3)*.012*talkLvl:0))*mo+sl*.09+thinking*.08*thinkDir;
  P.tilt=ease(P.tilt,tiltT,thinking||sl>.3?2:8,dt);
  P.hx=noise(tNow*.7,5)*14*en*mo;
  P.breath=Math.sin(tNow*(sl>.5?1.2:2.0));
  P.hy=(bob*.35+nodY*.5)*mo+sl*30+thinking*6;
  P.jump=jumpY;
  // antenna spring (driven by head accel)
  const drive=(bobV*.0009+(P.tilt-prevTilt)/dt*.4);prevTilt=P.tilt;
  P.antV+=(-P.ant*90-P.antV*5+drive*30)*dt;P.ant+=P.antV*dt;P.ant=clamp(P.ant,-1.5,1.5);
  if(Math.random()<dt*.12)antKick(rnd(.5,2));
}
let prevTilt=0,VK=1,VOX=0,VOY=0;
// ---------- render ----------
function composeFace(){
  fc.clearRect(0,0,N,N);fc.drawImage(IMG.base,0,0);
  const m=P.mouth;
  const ah=sstep(.08,.3,m),af=sstep(.48,.7,m);
  if(ah>.01){fc.globalAlpha=ah;fc.drawImage(IMG.half,...POS.half)}
  if(af>.01){fc.globalAlpha=af;fc.drawImage(IMG.full,...POS.full)}
  if(P.blink>.05){fc.globalAlpha=sstep(.15,.7,P.blink);fc.drawImage(IMG.blink,...POS.blink)}
  fc.globalAlpha=1;
  fc.globalCompositeOperation='destination-out';fc.fillStyle=TOPFADE;fc.fillRect(0,0,N,110);fc.globalCompositeOperation='source-over';
}
const TOPFADE=(()=>{const g=fc.createLinearGradient(0,0,0,110);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');return g})();
function drawWarped(c,k,ox,oy){
  // horizontal strips: head (above NECK) bends/tilts, body breathes; antennae wobble
  const STEP=6;
  for(let y=0;y<N;y+=STEP){
    const yc=y+STEP/2;
    const h=sstep(NECK+70,NECK-110,yc);           // 1 = head, 0 = body
    const ant=Math.pow(clamp((260-yc)/260),1.6);   // antenna region
    const dx=h*(P.hx+P.tilt*(NECK-yc))+ant*P.ant*38;
    const dy=h*P.hy+P.jump-(N-yc)*P.breath*.006;
    const sx=1+h*P.squash,sy=1-h*P.squash*.6;
    const dw=N*k*sx,dh=STEP*k*sy+1.2;
    c.drawImage(face,0,y,N,STEP,ox+(N/2*(1-sx)+dx)*k,oy+(y*sy+(1-sy)*NECK*h+dy)*k,dw,dh);
  }
}
function drawBubble(c){if(!bubble||tNow>bubble.until)return;const a=clamp((bubble.until-tNow)/.3);
  c.save();c.globalAlpha=a;c.font='800 54px system-ui,Segoe UI,Arial';const tw=Math.min(c.measureText(bubble.text).width,700);
  const w=tw+64,h=96;const vr=(cv.width-VOX)/VK-20,vl=-VOX/VK+20;let x=Math.max(vl,Math.min(820,vr-w)),y=Math.max(-VOY/VK+20,90+P.hy);roundRect(c,x,y,w,h,34);c.fillStyle='#fff';c.fill();c.strokeStyle='#2a0d10';c.lineWidth=6;c.stroke();
  c.beginPath();c.moveTo(x+50,y+h-4);c.lineTo(x+10,y+h+50);c.lineTo(x+100,y+h-4);c.closePath();c.fillStyle='#fff';c.fill();c.beginPath();c.moveTo(x+50,y+h);c.lineTo(x+10,y+h+50);c.lineTo(x+100,y+h);c.stroke();
  c.fillStyle='#2a0d10';c.textBaseline='middle';c.fillText(bubble.text,x+32,y+h/2+3,700);c.restore()}
function drawParts(c,dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue}p.vy+=(p.k==='z'?-10:260)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  const a=clamp(1-p.t/p.life)*clamp(p.t*6);c.save();c.globalAlpha=a;c.translate(p.x,p.y);
  if(p.k==='heart'){c.scale(p.r/16,p.r/16);c.beginPath();c.moveTo(0,6);c.bezierCurveTo(-18,-8,-8,-20,0,-9);c.bezierCurveTo(8,-20,18,-8,0,6);c.fillStyle='#ff4d6d';c.fill()}
  else if(p.k==='star'){c.rotate(p.t*4);c.beginPath();for(let q=0;q<10;q++){const r=q%2?p.r*.45:p.r;c.lineTo(Math.cos(q*PI/5)*r,Math.sin(q*PI/5)*r)}c.closePath();c.fillStyle='#ffd23f';c.fill()}
  else{c.font=`800 ${p.r}px system-ui`;c.fillStyle='#fff';c.strokeStyle='#2a0d10';c.lineWidth=5;c.strokeText('Z',0,0);c.fillText('Z',0,0)}
  c.restore()}}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000)||.016;last=now;tNow+=dt;
  requestAnimationFrame(frame);
  if(loaded<4)return;
  update(dt);composeFace();
  const pw=cv.width,ph=cv.height,b=BGS[S.bg]||BGS.market;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,pw,ph);
  ctx.save();
  const framed=S.frame&&S.bg!=='yesil'&&S.bg!=='seffaf';
  if(framed){roundRect(ctx,0,0,pw,ph,Math.min(pw,ph)*.045);ctx.clip()}
  if(b.flat){ctx.fillStyle=b.flat;ctx.fillRect(0,0,pw,ph)}else if(bgCv)ctx.drawImage(bgCv,0,0);
  const k=ph*S.zoom*1.02/N,ox=pw/2-N/2*k,oy=ph-N*k+ph*.02;VK=k;VOX=ox;VOY=oy;
  lc.setTransform(1,0,0,1,0,0);lc.clearRect(0,0,pw,ph);
  drawWarped(lc,k,ox,oy);
  if(false){lc.globalCompositeOperation='source-atop';const e=b.side>0?ox+N*k:ox;const g=lc.createLinearGradient(e,0,pw/2,0);g.addColorStop(0,b.rim);g.addColorStop(.6,'rgba(0,0,0,0)');lc.fillStyle=g;lc.fillRect(0,0,pw,ph);lc.globalCompositeOperation='source-over'}
  // soft contact shadow
  ctx.drawImage(lay,0,0);
  
  ctx.setTransform(1,0,0,1,0,0);
  if(S.name){const fs=Math.max(14,ph*.038);ctx.font=`800 ${fs}px system-ui,Segoe UI,Arial`;const tw=ctx.measureText(S.name).width;const x=ph*.03,y=ph-ph*.03-fs*1.5;
    roundRect(ctx,x,y,tw+fs*1.2,fs*1.5,fs*.5);ctx.fillStyle='rgba(20,8,12,.72)';ctx.fill();ctx.fillStyle='#f6b6bd';ctx.textBaseline='middle';ctx.fillText(S.name,x+fs*.6,y+fs*.78)}
  ctx.restore();
  if(framed){const lw=Math.max(3,ph*.008);roundRect(ctx,lw/2,lw/2,pw-lw,ph-lw,Math.min(pw,ph)*.045);ctx.strokeStyle='#e8919b';ctx.lineWidth=lw;ctx.stroke()}
}
// ---------- UI ----------
const $=id=>document.getElementById(id);
function bindUI(){
  const rng=(id,fmt)=>{const el=$(id),v=$(id+'V');el.value=S[id];const up=()=>{S[id]=+el.value;if(v)v.textContent=fmt?fmt(S[id]):S[id];save()};el.oninput=up;up()};
  rng('gain',v=>v.toFixed(1)+'x');rng('gate');rng('zoom',v=>Math.round(v*100)+'%');rng('sleep',v=>v+' sn');rng('motion',v=>Math.round(v*100)+'%');
  $('bgSel').value=S.bg;$('bgSel').onchange=e=>{if(e.target.value==='resim'){$('bgFile').click()}S.bg=e.target.value;save();renderBg()};
  if($('bgFile'))$('bgFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{userImg=im;renderBg();try{localStorage.setItem('hamamcanImg',rd.result)}catch(err){}};im.src=rd.result};rd.readAsDataURL(f)};

  $('wsUrl').value=S.ws;$('wsUrl').onchange=e=>{S.ws=e.target.value.trim();save();connectWS()};
  $('micSel').onchange=e=>{S.mic=e.target.value;save();startMic(S.mic)};
  document.querySelectorAll('#panel [data-t]').forEach(b=>b.onclick=()=>startReact(b.dataset.t,'test_kullanici'));
  addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){fakeTalk=true;e.preventDefault()}if(e.key==='h'||e.key==='H'){const p=$('panel');p.style.display=p.style.display==='block'?'none':'block';listMics()}
    if(e.key==='g')startReact('gift','test_kullanici');if(e.key==='b')startReact('big','test_kullanici')});
  addEventListener('keyup',e=>{if(e.code==='Space')fakeTalk=false});
  try{const d=localStorage.getItem('hamamcanImg');if(d){const im=new Image();im.onload=()=>{userImg=im;if(S.bg==='resim')renderBg()};im.src=d}}catch(e){}
}
bindUI();resize();connectWS();requestAnimationFrame(frame);
if(qp.has('demo')){fakeTalk=true;document.getElementById('start').style.display='none'}
</script>
