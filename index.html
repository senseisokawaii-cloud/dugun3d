<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Düğün 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--g1:#fff3c4;--g2:#f2c96a;--g3:#a8711c;--wine:#7a1028}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Baloo 2",system-ui,sans-serif;color:#fff}
#app{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#000;--u:4px}
#app canvas{display:block;position:absolute;inset:0}
.glass{background:linear-gradient(160deg,rgba(110,14,40,.88),rgba(50,6,20,.85));border:calc(var(--u)*.3) solid rgba(242,201,106,.8);
  box-shadow:0 calc(var(--u)*1) calc(var(--u)*4) rgba(0,0,0,.55),0 0 calc(var(--u)*2.5) rgba(242,201,106,.25)}
#title{position:absolute;top:calc(var(--u)*22);left:0;right:0;text-align:center;pointer-events:none;z-index:2}
#title .t{font-family:"Great Vibes",cursive;font-weight:900;font-size:calc(var(--u)*9.5);letter-spacing:.06em;line-height:1;
  background:linear-gradient(180deg,#fffbe6 0%,var(--g2) 46%,var(--g3) 54%,#ffe7a0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 calc(var(--u)*.5) 0 #4a0a1a) drop-shadow(0 0 calc(var(--u)*2) rgba(0,0,0,.6))}
#tempo{position:absolute;right:calc(var(--u)*2.5);top:calc(var(--u)*36);width:calc(var(--u)*30);padding:calc(var(--u)*1.4) calc(var(--u)*2);border-radius:calc(var(--u)*2.4);pointer-events:none;z-index:2}
#tempo .lb{display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--u)*2.6);font-weight:800;letter-spacing:.2em;color:var(--g1)}
#tempo .lb b{font-size:calc(var(--u)*3.4);letter-spacing:0;color:#fff}
#tempo .bar{height:calc(var(--u)*1.6);border-radius:9px;background:rgba(255,255,255,.15);margin-top:calc(var(--u)*.9);overflow:hidden}
#tempo .bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#ffd36b,#ff7a2b,#ff2b55);transition:width .4s}
#tempo.hot{animation:hot .5s infinite alternate}
@keyframes hot{to{box-shadow:0 0 calc(var(--u)*5) rgba(255,90,40,.9)}}
#feed{position:absolute;left:50%;bottom:calc(var(--u)*20.5);transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:calc(var(--u)*.9);pointer-events:none;z-index:2;width:92%}
.fd{padding:calc(var(--u)*.8) calc(var(--u)*2.6);border-radius:999px;font-size:calc(var(--u)*3.2);font-weight:600;animation:fin .4s ease-out;transition:opacity .6s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;background:rgba(50,6,20,.78);border:1px solid rgba(242,201,106,.55)}
.fd b{color:#ffe7a0}
.fd img.av{width:1.5em;height:1.5em;border-radius:50%;vertical-align:middle;margin:-.2em .35em 0 0;object-fit:cover;border:1px solid rgba(255,255,255,.6)}
@keyframes fin{from{transform:translateY(14px);opacity:0}}
#banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.7);opacity:0;transition:transform .45s cubic-bezier(.2,1.6,.4,1),opacity .3s;pointer-events:none;z-index:3;
  display:flex;align-items:center;gap:calc(var(--u)*2.4);padding:calc(var(--u)*1.6) calc(var(--u)*5) calc(var(--u)*1.6) calc(var(--u)*1.6);border-radius:999px;white-space:nowrap;max-width:92%}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner .ic{width:calc(var(--u)*13);height:calc(var(--u)*13);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--u)*7.5);flex:none;
  background:radial-gradient(circle at 35% 30%,#fff,#ffcf5a 40%,#c0451c);box-shadow:0 0 calc(var(--u)*3.5) rgba(255,170,60,.85)}
#banner .t1{font-family:"Great Vibes",cursive;font-weight:900;font-size:calc(var(--u)*5.6);color:var(--g1)}
#banner .t2{font-size:calc(var(--u)*4.2);font-weight:700;max-width:calc(var(--u)*58);overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(.5);font-family:"Great Vibes",cursive;font-size:calc(var(--u)*16);font-weight:900;
  color:#fff;text-shadow:0 0 20px #ff6a2a,0 0 50px #ff2b55,0 5px 0 #6a0020;opacity:0;transition:all .4s cubic-bezier(.2,1.6,.4,1);pointer-events:none;white-space:nowrap;z-index:3}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#note{position:absolute;left:50%;bottom:calc(var(--u)*14);transform:translateX(-50%);z-index:2;pointer-events:none;padding:calc(var(--u)*.6) calc(var(--u)*2.2);border-radius:999px;
  font-size:calc(var(--u)*2.6);font-weight:600;background:rgba(50,6,20,.72);border:1px solid rgba(242,201,106,.5);white-space:nowrap}
#note b{color:#ffe7a0}
#aiTag{position:absolute;right:calc(var(--u)*2);top:calc(var(--u)*20);z-index:2;pointer-events:none;padding:calc(var(--u)*.4) calc(var(--u)*1.4);border-radius:999px;font-size:calc(var(--u)*2.1);font-weight:600;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.35)}
#couple{position:absolute;top:calc(var(--u)*21);left:0;right:0;z-index:2;pointer-events:none;display:flex;justify-content:center;align-items:flex-end;gap:calc(var(--u)*2.2)}
#couple .c{display:flex;flex-direction:column;align-items:center;max-width:40%}
#couple .cap{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:calc(var(--u)*2.8);letter-spacing:.25em;color:#ffe7a0;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#couple .n{font-family:"Great Vibes",cursive;font-size:calc(var(--u)*11.5);line-height:1.05;color:#fff6dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 .15em;
  text-shadow:0 calc(var(--u)*.45) 0 #7a1028,0 0 calc(var(--u)*2.5) rgba(0,0,0,.75)}
#couple .n.e{opacity:.55}
#couple .h{font-size:calc(var(--u)*8);color:#ff3d63;text-shadow:0 0 calc(var(--u)*2.5) rgba(255,60,100,.9);animation:beat 1.1s infinite;margin-bottom:calc(var(--u)*1.5)}
@keyframes beat{50%{transform:scale(1.2)}}
#load{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:radial-gradient(#3a0a18,#000);font-size:calc(var(--u)*4);text-align:center;transition:opacity .8s}
#load.off{opacity:0;pointer-events:none}
#debug{position:absolute;left:4px;bottom:2px;font-size:10px;opacity:.25;z-index:2;pointer-events:none}
#hint{position:absolute;right:10px;bottom:10px;opacity:.55;font-size:12px;transition:opacity 1s;pointer-events:none;z-index:2}
#panel{position:fixed;right:12px;top:12px;width:330px;color:#eee;border-radius:14px;padding:14px;display:none;font-size:13px;max-height:92vh;overflow:auto;z-index:10;--u:4px}
#panel h3{margin:0 0 8px;font-family:"Great Vibes",cursive;color:var(--g2);font-size:17px}
#panel h4{margin:14px 0 6px;color:#f5b7c6;font-size:11px;letter-spacing:.15em;text-transform:uppercase}
#panel input[type=text],#panel input[type=number]{width:100%;box-sizing:border-box;background:#1a0509;color:#fff;border:1px solid #6a4630;border-radius:7px;padding:6px;font-family:inherit}
#panel button,#testSheet button{background:linear-gradient(#7a1838,#3b0818);color:#fff;border:1px solid #b9792f;border-radius:7px;padding:6px 9px;margin:3px 2px;cursor:pointer;font-size:12px;font-family:inherit}
#panel label{display:block;margin:6px 0 3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mut{opacity:.65;font-size:11px}
#testFab{position:fixed;right:14px;bottom:44px;z-index:11;font:600 15px "Baloo 2",sans-serif;color:#fff;padding:10px 16px;border-radius:999px;cursor:pointer;
  background:linear-gradient(#7a1838,#3b0818);border:1.5px solid #f2c96a;box-shadow:0 6px 20px rgba(0,0,0,.6)}
#testFab.hide{display:none}
#testSheet{position:fixed;right:14px;bottom:96px;width:300px;z-index:11;border-radius:16px;padding:12px;display:none;font-size:13px;--u:4px}
#testSheet.on{display:block}
#testSheet .th{display:flex;justify-content:space-between;font:700 15px "Great Vibes",cursive;color:#f2c96a;margin-bottom:8px}
#tsClose{cursor:pointer;opacity:.7}
#testSheet input{width:100%;box-sizing:border-box;background:#1a0509;color:#fff;border:1px solid #6a4630;border-radius:8px;padding:7px;margin-bottom:6px;font-family:"Baloo 2",sans-serif}
#testSheet .tg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#testSheet .tg button{margin:0;padding:8px 6px;font-weight:600}
#testSheet .row2{display:flex;gap:6px;margin-top:8px}#testSheet .row2 input{width:80px;margin:0}#testSheet .row2 button{flex:1;margin:0}
</style>
</head>
<body>
<div id="app">
  <div id="feed"></div>
  <div id="couple"><div class="c"><span class="cap">GELİN</span><span class="n e" id="cG">Gelin</span></div><span class="h">❤</span><div class="c"><span class="cap">DAMAT</span><span class="n e" id="cD">Damat</span></div></div>
  <div id="banner" class="glass"><div class="ic" id="bIc">👰</div><div style="min-width:0"><div class="t1" id="bT1"></div><div class="t2" id="bT2"></div></div></div>
  <div id="toast"></div>
  <div id="note"><b>değiş</b> → karakter değişir</div>
  <div id="load">Karakterler yükleniyor…</div>
  <div id="debug" class="ver"></div>
  <div id="hint">H: kontrol paneli · T: deneme tuşu</div>
</div>
<button id="testFab">🧪 Deneme</button>
<div id="testSheet" class="glass">
  <div class="th"><span>🧪 Deneme <small style="font-size:11px;font-weight:600;color:#ffe7a0;opacity:.85"><span class="ver"></span></small></span><span id="tsClose">✕</span></div>
  <input id="tsName" placeholder="İsim (boşsa rastgele)">
  <input id="tsMsg" placeholder="Yorum (boşsa rastgele)">
  <div class="tg">
    <button data-x="join">👋 1 kişi yorumla katılsın</button><button data-x="join10">👥 +10 kişi</button>
    <button data-x="chat">💬 Yorum</button><button data-x="degis">🔄 değiş</button>
    <button data-x="gul">🌹 Gül (1)</button><button data-x="like">❤️ +1000 beğeni</button>
    <button data-x="basi">🧣 Halay başı</button><button data-x="sagdic">🤵 Sağdıç</button>
    <button data-x="nedime">💃 Nedime</button><button data-x="cos">🔥 Coştur</button>
    <button data-x="gelin">👰 Gelin</button><button data-x="damat">🤵 Damat</button>
    <button data-x="clear">🚪 Herkesi çıkar</button>
  </div>
  <div class="row2"><input id="tsCoins" type="number" min="1" value="50"><button data-x="gift">🎁 Bu kadar coin</button></div>
</div>
<div id="panel" class="glass">
  <h3>Düğün 3D Kontrol <small style="font-size:11px;opacity:.6" class="ver"></small></h3>
  <h4>TikTok bağlantısı</h4>
  <label>WebSocket adresi (TikFinity)</label>
  <input type="text" id="wsUrl" value="ws://127.0.0.1:21213/">
  <div><button id="wsBtn">Bağlan</button><button id="wsStop">Kes</button></div>
  <div id="wsStatus" class="mut">Bağlı değil</div>
  <h4>Roller (toplam coin eşiği)</h4>
  <div class="g2">
    <div><label>👰 Gelin hediyesi (adı)</label><input type="text" id="gGelin"></div>
    <div><label>🤵 Damat hediyesi (adı)</label><input type="text" id="gDamat"></div>
    <div><label>🤵💃 Sağdıç / Nedime</label><input type="number" id="thSagdic" min="1"></div>
    <div><label>🧣 Halay başı</label><input type="number" id="thBasi" min="1"></div>
    <div><label>Rol süresi (dk)</label><input type="number" id="roleMin" min="1"></div>
  </div>
  <h4>Halay</h4>
  <div class="g2">
    <div><label>En fazla kişi</label><input type="number" id="maxChars" min="5"></div>
    <div><label>Pasif sayılma (dk)</label><input type="number" id="idleMin" min="1"></div>
  </div>
  <label>🔊 Ses efektleri <input type="range" id="vol" min="0" max="1" step=".05" style="width:100%"></label>
  <label><input type="checkbox" id="shadows"> Gölgeler (kasarsa kapat)</label>
  <label><input type="checkbox" id="showNames"> İsim etiketleri</label>
  <label><input type="checkbox" id="showBubbles"> Yorum balonları</label>
  <label><input type="checkbox" id="showFeed"> Alttaki bildirimler (gelin geldi vb.)</label>
  <h4>Modeller</h4>
  <div id="mdlStatus" class="mut">Kontrol ediliyor…</div>
  <label>Bilgisayardan dene (.fbx dosyalarını seç)</label><input type="file" id="mdlFiles" multiple accept=".fbx">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
(()=>{
const VERSION='3D v10';document.querySelectorAll('.ver').forEach(e=>e.textContent=VERSION);
const $=id=>document.getElementById(id);
const V3=THREE.Vector3,PI=Math.PI,TAU=PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[(Math.random()*a.length)|0],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function angLerp(a,b,t){let d=((b-a)%TAU+TAU*1.5)%TAU-PI;return a+d*t}

// ================= settings =================
const DEF={gGelin:'Bouquet',gDamat:'Perfume',thGelin:20,thSagdic:10,thBasi:5,roleMin:3,maxChars:75,idleMin:5,vol:.9,shadows:true,showNames:true,showPics:true,showBubbles:true,showFeed:true};
let S={...DEF};try{Object.assign(S,JSON.parse(localStorage.getItem('dugun3d')||'{}'))}catch(e){}
if(!S.v4b){S.maxChars=60;S.v4b=1}if(!S.v5){S.idleMin=5;S.v5=1}if(!S.gGelin)S.gGelin='Bouquet';if(!S.gDamat)S.gDamat='Perfume';if(!S.v5b){S.thGelin=20;S.thSagdic=10;S.thBasi=5;S.v5b=1}
for(const k of['showNames','showBubbles','showFeed'])if(S[k]===undefined)S[k]=true;S.showPics=false;
// Link ayarları (LIVE Studio için): ?balon=0&isim=0&foto=0&bildirim=0 — linkteki ayar paneldekini ezer
{const q=new URLSearchParams(location.search),M={balon:'showBubbles',isim:'showNames',foto:'showPics',bildirim:'showFeed'};
 for(const k in M)if(q.has(k))S[M[k]]=!/^(0|false|hayir|hayır|kapali|kapalı)$/i.test(q.get(k));}
if(!S.v10){S.maxChars=75;S.v10=1}if(S.vol==null)S.vol=.9;
const saveS=()=>{try{localStorage.setItem('dugun3d',JSON.stringify(S))}catch(e){}};

// ================= layout 9:16 =================
const app=$('app');let W=0,H=0;
function fit(){const vw=innerWidth,vh=innerHeight;if(vw/vh>9/16){H=vh;W=Math.round(vh*9/16)}else{W=vw;H=Math.round(vw*16/9)}
  app.style.width=W+'px';app.style.height=H+'px';app.style.setProperty('--u',(W/100)+'px');
  if(renderer){renderer.setSize(W,H);camera.aspect=W/H;camera.updateProjectionMatrix()}}

// ================= renderer / scene =================
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=!!S.shadows;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xe9d6b8,70,230);
const camera=new THREE.PerspectiveCamera(48,9/16,.1,400);
fit();addEventListener('resize',fit);
// ================= ses efektleri (kodla üretilir, dosya gerekmez) =================
const SFX=(()=>{let ac=null,master=null,nb=null;
  function A(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=S.vol;
      const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;master.connect(comp);comp.connect(ac.destination);
      nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){ac=null;return null}}
    if(ac.state==='suspended')ac.resume().catch(()=>{});return ac}
  function clap(t,v){const s=ac.createBufferSource();s.buffer=nb;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=rnd(900,2400);bp.Q.value=rnd(.7,1.5);
    const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.001,t+rnd(.06,.12));
    s.connect(bp);bp.connect(g);g.connect(master);s.start(t,rnd(0,.8),.15)}
  function applause(dur,dens,v){const t0=ac.currentTime+.02,n=Math.round(dur*dens);for(let i=0;i<n;i++){const u=Math.random();clap(t0+u*dur,v*(1-u*u*.75)*rnd(.5,1))}}
  function ding(t,f,v){[1,2.76,5.4].forEach((m,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f*m;g.gain.setValueAtTime(v/(i+1),t);g.gain.exponentialRampToValueAtTime(.0005,t+1.1/(i+1));o.connect(g);g.connect(master);o.start(t);o.stop(t+1.2)})}
  function davul(t,big,v){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(big?115:190,t);o.frequency.exponentialRampToValueAtTime(big?46:95,t+.18);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+(big?.5:.2));o.connect(g);g.connect(master);o.start(t);o.stop(t+.55);
    const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=big?900:2600;const g2=ac.createGain();g2.gain.setValueAtTime(v*.55,t);g2.gain.exponentialRampToValueAtTime(.001,t+.07);s.connect(f);f.connect(g2);g2.connect(master);s.start(t,rnd(0,.5),.1)}
  function zilgit(t,dur,v){for(let k=0;k<3;k++){const o=ac.createOscillator(),g=ac.createGain(),lfo=ac.createOscillator(),lg=ac.createGain(),am=ac.createGain();const f0=rnd(1050,1400),r=rnd(7.5,9.5);
      o.type='triangle';o.frequency.value=f0;lfo.frequency.value=r;lg.gain.value=f0*.07;lfo.connect(lg);lg.connect(o.frequency);
      const tr=ac.createOscillator();tr.frequency.value=r;const tg=ac.createGain();tg.gain.value=.5;tr.connect(tg);tg.connect(am.gain);am.gain.value=.5;
      const st=t+k*.06;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v*.3,st+.08);g.gain.setValueAtTime(v*.3,st+dur-.3);g.gain.linearRampToValueAtTime(0,st+dur);
      o.connect(am);am.connect(g);g.connect(master);[o,lfo,tr].forEach(x=>{x.start(st);x.stop(st+dur+.1)})}}
  function zurna(t,v){[587,659,698,784,698,659,587,659].forEach((f,i)=>{const tt=t+i*.17,o=ac.createOscillator(),g=ac.createGain(),bp=ac.createBiquadFilter(),vb=ac.createOscillator(),vg=ac.createGain();
      o.type='sawtooth';o.frequency.value=f;vb.frequency.value=6;vg.gain.value=f*.012;vb.connect(vg);vg.connect(o.frequency);bp.type='bandpass';bp.frequency.value=f*2.2;bp.Q.value=1.6;
      g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(v*.3,tt+.02);g.gain.setValueAtTime(v*.3,tt+.14);g.gain.linearRampToValueAtTime(0,tt+.18);
      o.connect(bp);bp.connect(g);g.connect(master);o.start(tt);o.stop(tt+.2);vb.start(tt);vb.stop(tt+.2)})}
  return{
    unlock(){A()},
    vol(v){if(master)master.gain.value=v},

const NAMES=['ayse_k','mehmet34','zeyno','emre.06','kübra','burak_tr','elif.nur','hasan_dayi','merve','oguz','selin_','can_bey','derya','yusuf','gizem','tuna','fatma_teyze','ali_veli','esra','kerem'];
const MSGS=['Hayırlı olsun!','Oyy oyyy','Halay başı kim?','Gelin çok güzel','Davul zurna nerde','Mutluluklar 🎉','Bizi de alın halaya','Coştuk be','Damat bey kalk oyna','Allah mesut etsin'];
let tc=0;const tName=()=>$('tsName').value.trim()||pick(NAMES)+(++tc);let lastTest=null;
function testEvent(k){const nm=tName(),id='t_'+nm;
  if(k==='join'){onChat(id,nm,pick(MSGS));lastTest=id}
  if(k==='join10')for(let i=0;i<10;i++){const n2=pick(NAMES)+(++tc);onChat('t_'+n2,n2,pick(MSGS))}
  if(k==='chat'){const c=lastTest&&chars.get(lastTest)||pick([...chars.values()]);if(c)onChat(c.id,c.nick,$('tsMsg').value.trim()||pick(MSGS));else onChat(id,nm,$('tsMsg').value.trim()||pick(MSGS))}
  if(k==='degis'){const c=lastTest&&chars.get(lastTest)||pick([...chars.values()]);if(c)onChat(c.id,c.nick,'değiş')}
  if(k==='gul'){onGift(id,nm,1,'Rose');lastTest=id}
  if(k==='gift'){onGift(id,nm,+$('tsCoins').value||50);lastTest=id}
  if(k==='like')onLike(1000);
  if(k==='cos')tempo=Math.min(3,tempo+1.2);
  if(k==='gelin'){onGift(id,nm,20,S.gGelin);lastTest=id}if(k==='damat'){onGift(id,nm,20,S.gDamat);lastTest=id}
  const roleT={basi:S.thBasi,sagdic:S.thSagdic,nedime:S.thSagdic};
  if(roleT[k]){const c=touch(id,nm);c.g=(k==='gelin'||k==='nedime')?'f':'m';const ks=guestKeys(c.g);if(ks.length&&MDEF[c.mk]&&MDEF[c.mk].g!==c.g){c.mk=c.guestMk=pick(ks);buildBody(c)}onGift(id,nm,roleT[k]);lastTest=id}
  if(k==='clear')for(const c of[...chars.values()])leave(c)}
$('testFab').onclick=()=>$('testSheet').classList.toggle('on');$('tsClose').onclick=()=>$('testSheet').classList.remove('on');

// ================= websocket (TikFinity) =================
let ws=null,wsWanted=true,wsRetry,wsTry=0,msgCount=0;const WS_ALT=['ws://127.0.0.1:21213/','ws://localhost:21213/'];
function connect(){clearTimeout(wsRetry);if(ws){try{ws.onclose=null;ws.close()}catch(e){}}const url=$('wsUrl').value.trim();
  try{ws=new WebSocket(url)}catch(e){$('wsStatus').textContent='Adres hatalı';return}
  $('wsStatus').textContent='Bağlanıyor…';
  ws.onopen=()=>{$('wsStatus').textContent='✅ Bağlı';$('testFab').classList.add('hide');$('testSheet').classList.remove('on')};
  ws.onclose=()=>{$('wsStatus').textContent='❌ TikFinity bulunamadı, tekrar deneniyor…';
    if(wsWanted){wsTry++;const cur=$('wsUrl').value.trim();if(WS_ALT.includes(cur))$('wsUrl').value=WS_ALT[wsTry%2];wsRetry=setTimeout(connect,2500)}};
  ws.onmessage=e=>handleMsg(e.data)}
function handleMsg(raw){let m;try{m=typeof raw==='string'?JSON.parse(raw):raw}catch(e){return}
  if(Array.isArray(m)){m.forEach(handleMsg);return}
  const ev=String(m.event||m.type||m.eventName||m.eventType||'').toLowerCase();let d=m.data||m.payload||m;if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){}}
  msgCount++;$('wsStatus').textContent=`✅ Bağlı · ${msgCount} mesaj · son: ${ev||'?'}`;
  const u=(d.user&&typeof d.user==='object')?d.user:(d.userDetails||d.sender||{});
  const id=String(d.uniqueId||u.uniqueId||u.unique_id||d.userId||u.userId||u.id||(typeof d.user==='string'?d.user:'')||d.username||u.username||d.nickname||u.nickname||'');
  const nick=String(d.nickname||u.nickname||u.nickName||d.uniqueId||u.uniqueId||d.username||id);const g=d.giftDetails||d.gift||{};
  {const pp=d.profilePictureUrl||u.profilePictureUrl||d.profilePicture&&(typeof d.profilePicture==='string'?d.profilePicture:(d.profilePicture.urls||d.profilePicture.url||[])[0])||u.profilePicture&&(typeof u.profilePicture==='string'?u.profilePicture:(u.profilePicture.urls||u.profilePicture.url||[])[0])||d.avatar||u.avatar||d.avatarUrl||'';
   if(id&&pp&&typeof pp==='string'&&pics.get(id)!==pp){pics.set(id,pp);const c=chars.get(id);if(c&&c.mode!=='leave')setLabel(c)}}
  if(/chat|comment|message/.test(ev)){if(id)onChat(id,nick,String(d.comment||d.text||d.message||d.content||''))}
  else if(ev.includes('gift')){if((d.giftType===1||g.giftType===1)&&d.repeatEnd===false)return;
    const dia=d.diamondCount||g.diamondCount||g.diamond_count||d.coins||d.diamonds||1,cnt=d.repeatCount||d.count||d.amount||1;if(id)onGift(id,nick,dia*cnt,d.giftName||g.giftName||g.name)}
  else if(ev.includes('like'))onLike(d.likeCount||d.count||1,d.totalLikeCount||d.totalLikes)}

{const v=$('vol');v.value=S.vol;v.addEventListener('input',()=>{S.vol=+v.value;saveS();SFX.vol(S.vol);SFX.rol()})}
