<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Düğün 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g1:#fff3c4;--g2:#f2c96a;--g3:#a8711c;--wine:#7a1028}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Poppins,system-ui,sans-serif;color:#fff}
#app{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#000;--u:4px}
#app canvas{display:block;position:absolute;inset:0}
.glass{background:linear-gradient(160deg,rgba(110,14,40,.88),rgba(50,6,20,.85));border:calc(var(--u)*.3) solid rgba(242,201,106,.8);
  box-shadow:0 calc(var(--u)*1) calc(var(--u)*4) rgba(0,0,0,.55),0 0 calc(var(--u)*2.5) rgba(242,201,106,.25)}
#title{position:absolute;top:calc(var(--u)*22);left:0;right:0;text-align:center;pointer-events:none;z-index:2}
#title .t{font-family:Cinzel,serif;font-weight:900;font-size:calc(var(--u)*9.5);letter-spacing:.06em;line-height:1;
  background:linear-gradient(180deg,#fffbe6 0%,var(--g2) 46%,var(--g3) 54%,#ffe7a0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 calc(var(--u)*.5) 0 #4a0a1a) drop-shadow(0 0 calc(var(--u)*2) rgba(0,0,0,.6))}
#tempo{position:absolute;right:calc(var(--u)*2.5);top:calc(var(--u)*36);width:calc(var(--u)*30);padding:calc(var(--u)*1.4) calc(var(--u)*2);border-radius:calc(var(--u)*2.4);pointer-events:none;z-index:2}
#tempo .lb{display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--u)*2.6);font-weight:800;letter-spacing:.2em;color:var(--g1)}
#tempo .lb b{font-size:calc(var(--u)*3.4);letter-spacing:0;color:#fff}
#tempo .bar{height:calc(var(--u)*1.6);border-radius:9px;background:rgba(255,255,255,.15);margin-top:calc(var(--u)*.9);overflow:hidden}
#tempo .bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#ffd36b,#ff7a2b,#ff2b55);transition:width .4s}
#tempo.hot{animation:hot .5s infinite alternate}
@keyframes hot{to{box-shadow:0 0 calc(var(--u)*5) rgba(255,90,40,.9)}}
#feed{position:absolute;left:50%;bottom:calc(var(--u)*20.5);transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:calc(var(--u)*.9);pointer-events:none;z-index:2;width:92%}
.fd{padding:calc(var(--u)*.8) calc(var(--u)*2.6);border-radius:999px;font-size:calc(var(--u)*3.2);font-weight:600;animation:fin .4s ease-out;transition:opacity .6s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;background:rgba(50,6,20,.78);border:1px solid rgba(242,201,106,.55)}
.fd b{color:#ffe7a0}
@keyframes fin{from{transform:translateY(14px);opacity:0}}
#banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.7);opacity:0;transition:transform .45s cubic-bezier(.2,1.6,.4,1),opacity .3s;pointer-events:none;z-index:3;
  display:flex;align-items:center;gap:calc(var(--u)*2.4);padding:calc(var(--u)*1.6) calc(var(--u)*5) calc(var(--u)*1.6) calc(var(--u)*1.6);border-radius:999px;white-space:nowrap;max-width:92%}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner .ic{width:calc(var(--u)*13);height:calc(var(--u)*13);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--u)*7.5);flex:none;
  background:radial-gradient(circle at 35% 30%,#fff,#ffcf5a 40%,#c0451c);box-shadow:0 0 calc(var(--u)*3.5) rgba(255,170,60,.85)}
#banner .t1{font-family:Cinzel,serif;font-weight:900;font-size:calc(var(--u)*5.6);color:var(--g1)}
#banner .t2{font-size:calc(var(--u)*4.2);font-weight:700;max-width:calc(var(--u)*58);overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(.5);font-family:Cinzel,serif;font-size:calc(var(--u)*16);font-weight:900;
  color:#fff;text-shadow:0 0 20px #ff6a2a,0 0 50px #ff2b55,0 5px 0 #6a0020;opacity:0;transition:all .4s cubic-bezier(.2,1.6,.4,1);pointer-events:none;white-space:nowrap;z-index:3}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#note{position:absolute;left:50%;bottom:calc(var(--u)*14);transform:translateX(-50%);z-index:2;pointer-events:none;padding:calc(var(--u)*.6) calc(var(--u)*2.2);border-radius:999px;
  font-size:calc(var(--u)*2.6);font-weight:600;background:rgba(50,6,20,.72);border:1px solid rgba(242,201,106,.5);white-space:nowrap}
#note b{color:#ffe7a0}
#load{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:radial-gradient(#3a0a18,#000);font-size:calc(var(--u)*4);text-align:center;transition:opacity .8s}
#load.off{opacity:0;pointer-events:none}
#debug{position:absolute;left:4px;bottom:2px;font-size:10px;opacity:.25;z-index:2;pointer-events:none}
#hint{position:absolute;right:10px;bottom:10px;opacity:.55;font-size:12px;transition:opacity 1s;pointer-events:none;z-index:2}
#panel{position:fixed;right:12px;top:12px;width:330px;color:#eee;border-radius:14px;padding:14px;display:none;font-size:13px;max-height:92vh;overflow:auto;z-index:10;--u:4px}
#panel h3{margin:0 0 8px;font-family:Cinzel,serif;color:var(--g2);font-size:17px}
#panel h4{margin:14px 0 6px;color:#f5b7c6;font-size:11px;letter-spacing:.15em;text-transform:uppercase}
#panel input[type=text],#panel input[type=number]{width:100%;box-sizing:border-box;background:#1a0509;color:#fff;border:1px solid #6a4630;border-radius:7px;padding:6px;font-family:inherit}
#panel button,#testSheet button{background:linear-gradient(#7a1838,#3b0818);color:#fff;border:1px solid #b9792f;border-radius:7px;padding:6px 9px;margin:3px 2px;cursor:pointer;font-size:12px;font-family:inherit}
#panel label{display:block;margin:6px 0 3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mut{opacity:.65;font-size:11px}
#testFab{position:fixed;right:14px;bottom:44px;z-index:11;font:600 15px Poppins,sans-serif;color:#fff;padding:10px 16px;border-radius:999px;cursor:pointer;
  background:linear-gradient(#7a1838,#3b0818);border:1.5px solid #f2c96a;box-shadow:0 6px 20px rgba(0,0,0,.6)}
#testFab.hide{display:none}
#testSheet{position:fixed;right:14px;bottom:96px;width:300px;z-index:11;border-radius:16px;padding:12px;display:none;font-size:13px;--u:4px}
#testSheet.on{display:block}
#testSheet .th{display:flex;justify-content:space-between;font:700 15px Cinzel,serif;color:#f2c96a;margin-bottom:8px}
#tsClose{cursor:pointer;opacity:.7}
#testSheet input{width:100%;box-sizing:border-box;background:#1a0509;color:#fff;border:1px solid #6a4630;border-radius:8px;padding:7px;margin-bottom:6px;font-family:Poppins,sans-serif}
#testSheet .tg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#testSheet .tg button{margin:0;padding:8px 6px;font-weight:600}
#testSheet .row2{display:flex;gap:6px;margin-top:8px}#testSheet .row2 input{width:80px;margin:0}#testSheet .row2 button{flex:1;margin:0}
</style>
</head>
<body>
<div id="app">
  <div id="feed"></div>
  <div id="banner" class="glass"><div class="ic" id="bIc">👰</div><div style="min-width:0"><div class="t1" id="bT1"></div><div class="t2" id="bT2"></div></div></div>
  <div id="toast"></div>
  <div id="note"><b>değiş</b> → karakter değişir</div>
  <div id="load">Karakterler yükleniyor…</div>
  <div id="debug">3D v4b</div>
  <div id="hint">H: kontrol paneli · T: deneme tuşu</div>
</div>
<button id="testFab">🧪 Deneme</button>
<div id="testSheet" class="glass">
  <div class="th"><span>🧪 Deneme <small style="font:600 11px Poppins;color:#ffe7a0;opacity:.85">3D v4b</small></span><span id="tsClose">✕</span></div>
  <input id="tsName" placeholder="İsim (boşsa rastgele)">
  <input id="tsMsg" placeholder="Yorum (boşsa rastgele)">
  <div class="tg">
    <button data-x="join">👋 1 kişi katılsın</button><button data-x="join10">👥 +10 kişi</button>
    <button data-x="chat">💬 Yorum</button><button data-x="degis">🔄 değiş</button>
    <button data-x="gul">🌹 Gül (1)</button><button data-x="like">❤️ +1000 beğeni</button>
    <button data-x="basi">🧣 Halay başı</button><button data-x="sagdic">🤵 Sağdıç</button>
    <button data-x="nedime">💃 Nedime</button><button data-x="cos">🔥 Coştur</button>
    <button data-x="gelin">👰 Gelin</button><button data-x="damat">🤵 Damat</button>
    <button data-x="clear">🚪 Herkesi çıkar</button>
  </div>
  <div class="row2"><input id="tsCoins" type="number" min="1" value="50"><button data-x="gift">🎁 Bu kadar coin</button></div>
</div>
<div id="panel" class="glass">
  <h3>Düğün 3D Kontrol <small style="font-size:11px;opacity:.6">3D v1</small></h3>
  <h4>TikTok bağlantısı</h4>
  <label>WebSocket adresi (TikFinity)</label>
  <input type="text" id="wsUrl" value="ws://127.0.0.1:21213/">
  <div><button id="wsBtn">Bağlan</button><button id="wsStop">Kes</button></div>
  <div id="wsStatus" class="mut">Bağlı değil</div>
  <h4>Roller (toplam coin eşiği)</h4>
  <div class="g2">
    <div><label>👰🤵 Gelin / Damat</label><input type="number" id="thGelin" min="1"></div>
    <div><label>🤵💃 Sağdıç / Nedime</label><input type="number" id="thSagdic" min="1"></div>
    <div><label>🧣 Halay başı</label><input type="number" id="thBasi" min="1"></div>
    <div><label>Rol süresi (dk)</label><input type="number" id="roleMin" min="1"></div>
  </div>
  <h4>Halay</h4>
  <div class="g2">
    <div><label>En fazla kişi</label><input type="number" id="maxChars" min="5"></div>
    <div><label>Çıkış süresi (dk)</label><input type="number" id="idleMin" min="1"></div>
  </div>
  <label><input type="checkbox" id="shadows"> Gölgeler (kasarsa kapat)</label>
  <h4>Modeller</h4>
  <div id="mdlStatus" class="mut">Kontrol ediliyor…</div>
  <label>Bilgisayardan dene (.fbx dosyalarını seç)</label><input type="file" id="mdlFiles" multiple accept=".fbx">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
(()=>{
const VERSION='3D v4b';
const $=id=>document.getElementById(id);
const V3=THREE.Vector3,PI=Math.PI,TAU=PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[(Math.random()*a.length)|0],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function angLerp(a,b,t){let d=((b-a)%TAU+TAU*1.5)%TAU-PI;return a+d*t}

// ================= settings =================
const DEF={thGelin:50,thSagdic:30,thBasi:15,roleMin:3,maxChars:60,idleMin:20,shadows:true};
let S={...DEF};try{Object.assign(S,JSON.parse(localStorage.getItem('dugun3d')||'{}'))}catch(e){}
if(!S.v4b){S.maxChars=60;S.v4b=1}
const saveS=()=>{try{localStorage.setItem('dugun3d',JSON.stringify(S))}catch(e){}};

// ================= layout 9:16 =================
const app=$('app');let W=0,H=0;
function fit(){const vw=innerWidth,vh=innerHeight;if(vw/vh>9/16){H=vh;W=Math.round(vh*9/16)}else{W=vw;H=Math.round(vw*16/9)}
  app.style.width=W+'px';app.style.height=H+'px';app.style.setProperty('--u',(W/100)+'px');
  if(renderer){renderer.setSize(W,H);camera.aspect=W/H;camera.updateProjectionMatrix()}}

// ================= renderer / scene =================
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=!!S.shadows;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xcfd9e6,70,230);
const camera=new THREE.PerspectiveCamera(48,9/16,.1,400);
fit();addEventListener('resize',fit);

const hemi=new THREE.HemisphereLight(0xdfeeff,0x6a5a40,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe2b8,1.35);sun.position.set(-12,24,18);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-24,right:24,top:24,bottom:-24,near:1,far:80});sun.shadow.bias=-.0006;sun.shadow.normalBias=.02;
scene.add(sun);scene.add(sun.target);
const fill=new THREE.DirectionalLight(0xffd0a0,.35);fill.position.set(10,6,-6);scene.add(fill);

function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}

// ---- sky ----
{const tex=canvasTex(16,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#5d8fd0');gr.addColorStop(.42,'#a9c8ea');gr.addColorStop(.5,'#f3dcc0');gr.addColorStop(1,'#d9c7aa');g.fillStyle=gr;g.fillRect(0,0,w,h)});
  const sky=new THREE.Mesh(new THREE.SphereGeometry(300,32,16),new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide,fog:false,depthWrite:false}));scene.add(sky);
  const cloudTex=canvasTex(256,128,(g,w,h)=>{for(let i=0;i<14;i++){const x=rnd(50,w-50),y=rnd(50,h-35),r=rnd(22,42);const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}});
  for(let i=0;i<14;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTex,fog:false,transparent:true,opacity:rnd(.6,.95),depthWrite:false}));
    const a=rnd(-1.3,1.3),d=rnd(140,220);s.position.set(Math.sin(a)*d,rnd(35,80),-Math.cos(a)*d);s.scale.set(rnd(60,110),rnd(25,40),1);scene.add(s)}}

// ---- ground ----
const cobble=canvasTex(1024,1024,(g,w,h)=>{g.fillStyle='#5b5046';g.fillRect(0,0,w,h);
  const n=24,sz=w/n;for(let r=0;r<n;r++)for(let c=0;c<n;c++){const x=c*sz+(r%2?sz/2:0)+rnd(-3,3),y=r*sz+sz/2+rnd(-3,3);
    const v=rnd(0,1),col=`rgb(${(150+v*45)|0},${(138+v*38)|0},${(122+v*30)|0})`,rot=rnd(0,PI);
    for(const ox of[-w,0,w])for(const oy of[-h,0,h]){g.fillStyle=col;g.beginPath();g.ellipse(x+ox,y+oy,sz*.44,sz*.4,rot,0,TAU);g.fill();
      g.fillStyle='rgba(255,255,255,.08)';g.beginPath();g.ellipse(x+ox-sz*.1,y+oy-sz*.12,sz*.25,sz*.18,0,0,TAU);g.fill()}}},[14,14]);
const ground=new THREE.Mesh(new THREE.CircleGeometry(38,96),new THREE.MeshLambertMaterial({map:cobble}));ground.rotation.x=-PI/2;ground.receiveShadow=true;scene.add(ground);
const grassTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#6f8f3e';g.fillRect(0,0,w,h);for(let i=0;i<2500;i++){g.fillStyle=pick(['#5f7f34','#7e9f48','#87a852','#6a8a3a']);g.fillRect(rnd(0,w),rnd(0,h),2,rnd(2,5))}},[40,40]);
const grass=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({map:grassTex}));grass.rotation.x=-PI/2;grass.position.y=-.02;grass.receiveShadow=true;scene.add(grass);
// halay pisti (hafif açık taşlı halka)
{const m=new THREE.Mesh(new THREE.RingGeometry(1.8,2.6,64),new THREE.MeshBasicMaterial({color:0xfff2d0,transparent:true,opacity:.0}));m.rotation.x=-PI/2;m.position.y=.01;scene.add(m)}
// gelin-damat halısı
const rug=new THREE.Mesh(new THREE.CircleGeometry(1.9,48),new THREE.MeshLambertMaterial({map:canvasTex(512,512,(g,w,h)=>{g.fillStyle='#8a1530';g.beginPath();g.arc(w/2,h/2,w/2,0,TAU);g.fill();
  g.strokeStyle='#e8c46a';g.lineWidth=14;g.beginPath();g.arc(w/2,h/2,w/2-22,0,TAU);g.stroke();g.lineWidth=4;g.beginPath();g.arc(w/2,h/2,w/2-52,0,TAU);g.stroke();
  for(let i=0;i<16;i++){const a=i/16*TAU;g.fillStyle='#e8c46a';g.beginPath();g.arc(w/2+Math.cos(a)*(w/2-80),h/2+Math.sin(a)*(w/2-80),9,0,TAU);g.fill()}})}));
rug.rotation.x=-PI/2;rug.position.set(0,.012,-.2);rug.receiveShadow=true;scene.add(rug);

// ---- houses ----
const plaster=['#efe4cf','#e9d7b9','#f3ece0','#e2cfa9','#efdcc3','#d9c6a6'];
function wallTex(base){return canvasTex(256,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<400;i++){g.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,255,255'},${rnd(.02,.06)})`;g.fillRect(rnd(0,w),rnd(0,h),rnd(3,14),rnd(3,14))}
  // pencere
  g.fillStyle='#6b4a2b';g.fillRect(88,70,80,104);g.fillStyle='#2c3f52';g.fillRect(96,78,64,88);g.fillStyle='#6b4a2b';g.fillRect(126,78,4,88);g.fillRect(96,120,64,4);
  g.fillStyle='rgba(255,255,255,.18)';g.fillRect(100,82,22,34);g.fillStyle='#8a6a48';g.fillRect(82,172,92,8)},[1,1])}
const WALLMATS=plaster.map(c=>{const t=wallTex(c);return t});
const roofMat=new THREE.MeshLambertMaterial({color:0xb5532d});const roofMat2=new THREE.MeshLambertMaterial({color:0x9c4426});
const woodMat=new THREE.MeshLambertMaterial({color:0x6b4a2b});const stoneMat=new THREE.MeshLambertMaterial({color:0x8d8273});
function house(x,z,w,d,floors,rot){const g=new THREE.Group();const h=floors*2.8;
  const tx=pick(WALLMATS).clone();tx.needsUpdate=true;tx.repeat.set(Math.max(1,Math.round(w/2.4)),floors);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;
  const txs=tx.clone();txs.needsUpdate=true;txs.repeat.set(Math.max(1,Math.round(d/2.4)),floors);
  const mw=new THREE.MeshLambertMaterial({map:tx}),ms=new THREE.MeshLambertMaterial({map:txs});
  const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[ms,ms,mw,mw,mw,mw]);body.position.y=h/2;body.castShadow=body.receiveShadow=true;g.add(body);
  const base=new THREE.Mesh(new THREE.BoxGeometry(w+.1,.6,d+.1),stoneMat);base.position.y=.3;g.add(base);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.74,1.8,4),Math.random()<.5?roofMat:roofMat2);roof.rotation.y=PI/4;roof.scale.set(w/Math.max(w,d),1,d/Math.max(w,d));roof.position.y=h+.9;roof.castShadow=true;g.add(roof);
  if(floors>1&&Math.random()<.75){const bal=new THREE.Group();const fl=new THREE.Mesh(new THREE.BoxGeometry(w*.55,.12,.9),woodMat);bal.add(fl);
    for(let i=0;i<=8;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.06,.8,.06),woodMat);p.position.set(-w*.27+i*w*.55/8,.4,.42);bal.add(p)}
    const rail=new THREE.Mesh(new THREE.BoxGeometry(w*.55,.08,.08),woodMat);rail.position.set(0,.8,.42);bal.add(rail);
    bal.position.set(rnd(-w*.15,w*.15),2.8,d/2+.45);g.add(bal)}
  const door=new THREE.Mesh(new THREE.BoxGeometry(1,2,.08),woodMat);door.position.set(rnd(-w*.3,w*.3),1,d/2+.03);g.add(door);

  const id=String(d.uniqueId||u.uniqueId||u.unique_id||d.userId||u.userId||u.id||(typeof d.user==='string'?d.user:'')||d.username||u.username||d.nickname||u.nickname||'');
  const nick=String(d.nickname||u.nickname||u.nickName||d.uniqueId||u.uniqueId||d.username||id);const g=d.giftDetails||d.gift||{};
  if(/chat|comment|message/.test(ev)){if(id)onChat(id,nick,String(d.comment||d.text||d.message||d.content||''))}
  else if(ev.includes('gift')){if((d.giftType===1||g.giftType===1)&&d.repeatEnd===false)return;
    const dia=d.diamondCount||g.diamondCount||g.diamond_count||d.coins||d.diamonds||1,cnt=d.repeatCount||d.count||d.amount||1;if(id)onGift(id,nick,dia*cnt,d.giftName||g.giftName||g.name)}
  else if(ev.includes('like'))onLike(d.likeCount||d.count||1,d.totalLikeCount||d.totalLikes)}

// ================= panel =================
const panel=$('panel');
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='h'||e.key==='H')panel.style.display=panel.style.display==='block'?'none':'block';
  if(e.key==='t'||e.key==='T'){$('testFab').classList.toggle('hide');$('testSheet').classList.remove('on')}});
$('wsBtn').onclick=()=>{wsWanted=true;connect()};$('wsStop').onclick=()=>{wsWanted=false;clearTimeout(wsRetry);if(ws)ws.close()};
function bind(id,key,fn){const el=$(id),cb=el.type==='checkbox';if(cb)el.checked=!!S[key];else el.value=S[key];
  el.addEventListener(cb?'change':'input',()=>{S[key]=cb?el.checked:Math.max(1,+el.value||1);saveS();fn&&fn()})}
['thGelin','thSagdic','thBasi','roleMin','maxChars','idleMin'].forEach(k=>bind(k,k));
bind('shadows','shadows',()=>{renderer.shadowMap.enabled=!!S.shadows;scene.traverse(o=>{if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true)}})});
setTimeout(()=>$('hint').style.opacity=0,7000);

window.__dugun={chars,holders,testEvent,M,CL,get tempo(){return tempo},set tempo(v){tempo=v}};
requestAnimationFrame(loop);loadModels();connect();
})();
</script>
